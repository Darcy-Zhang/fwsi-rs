[package]
name = "fwsi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast Flat Whole-Slide Image archive format"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
required-features = ["python"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-stub-gen"]

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crc32c = "0.6.8"
rayon = "1.12.0"
rusty_jpeg = { version = "0.4.2", default-features = false, features = ["std", "platform_independent"] }
thiserror = "2.0.21"
pyo3 = { version = "0.29.3", optional = true, features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23.1", default-features = false, features = ["infer_signature"], optional = true }
